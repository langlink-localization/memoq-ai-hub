packages:
  - apps/desktop

# Security overrides. pnpm >= 10 reads these from this file (the `pnpm` field
# in package.json is ignored); keep versions at or above the patched ranges
# reported by `pnpm audit`.
overrides:
  shell-quote: ^1.10.0
  tar: ^7.5.22
  '@xmldom/xmldom': ^0.8.15
  brace-expansion@^1: ^1.1.18
  brace-expansion@^2: ^2.1.4
  fast-uri: ^3.1.6
  fast-xml-builder: ^1.3.0
  ip-address: ^10.5.0
  lodash: ^4.18.1
  nanoid: ^3.3.17
  path-to-regexp: ^0.1.13
  picomatch@^2: ^2.3.2
  picomatch@^4: ^4.0.5
  postcss: ^8.5.26
  tmp: ^0.2.7
  vite: 8.2.0
  qs: ^6.16.0
  body-parser: 1.20.6
  '@tootallnate/once': 2.0.1
  esbuild: 0.28.1
  '@electron/packager': 18.4.4
  extract-zip: npm:@electron-internal/extract-zip@1.0.5
  browserslist: ^4.28.7

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
