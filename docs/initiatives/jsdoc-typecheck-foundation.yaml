last_verified_commit: >
  v1.0.48 candidate. Preview-helper part, segment, and document-cache shapes
  and memoQ integration install options live in runtimeDomain.d.ts.
  previewContextClient and integrationService use them. database.js and
  updateService do not interpret runtime state, profiles, or preview parts.
next_action: >
  Type the update manifest, asset, and persisted update-state shapes in
  updateService, and the sql.js handle in database.js, without shrinking the
  checkJs include list. Keep deep typedefs in providerPromptBuilder and
  providerRegistry.
allowed_interruptions:
  - emergency production fix
  - security or data correctness issue
drift_guard:
  ui_contract: docs/ui-governance.md
  toolchain_contract: AGENTS.md, package.json, and .github/workflows/ci.yml
  validation_command: pnpm run lint && pnpm run typecheck && pnpm run test:desktop && pnpm run test:repo
  source_of_truth: repository main branch, GitHub Actions, release tag, stable update manifest, and published release assets
intentional_divergences: []
resume_prompt: >
  This initiative runs progressive strict type checking over the plain-JS
  desktop sources through JSDoc annotations, tsc --noEmit (typescript 7.0.2),
  the pnpm run typecheck script, and a CI step. The typed scope today is all of
  apps/desktop/src/shared, src/qa, src/bilingual, src/asset, the provider
  modules (deep typedefs for prompt builder and registry), the runtime
  composition root and its services, database.js, integrationService,
  previewContextClient, updateService, gatewayRequestValidation.js, and
  rendererIpcSurface.js. Continue with next_action without weakening strict
  mode or shrinking the typed surface.
