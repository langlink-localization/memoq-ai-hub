resume_prompt: >
  This initiative runs progressive strict type checking over the plain-JS
  desktop sources through JSDoc annotations, tsc --noEmit (typescript 7.0.2),
  the pnpm run typecheck script, and a CI step. The typed scope today is all of
  apps/desktop/src/shared, src/qa, src/bilingual, src/asset, the provider
  modules (deep typedefs for prompt builder and registry), 18 runtime modules,
  plus gatewayRequestValidation.js and rendererIpcSurface.js. Continue with
