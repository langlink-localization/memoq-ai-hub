  apps/desktop/src/shared, src/qa, src/bilingual, src/asset, the provider
  modules (deep typedefs for prompt builder and registry), the runtime
  composition root and its services, database.js, integrationService,
  previewContextClient, updateService, gatewayRequestValidation.js, and
  rendererIpcSurface.js. Continue with next_action without weakening strict
  mode or shrinking the typed surface.
